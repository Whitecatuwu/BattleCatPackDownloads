<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TheBattleCat-Resource-Pack-Downloads</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/githubIcon.css">
    <link rel="stylesheet" href="css/background.css">
    <link rel="stylesheet" href="css/selectBox.css">
</head>
<body>
    <span>
        <h1>TheBattleCat-Resource-Pack-Downloads</h1>
        <style>
            h1 {
                font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
                font-size: 32px;
                text-shadow: 2px 2px 2px darkblue;
                color: #FFFFFF;
                display: flex;
                justify-content: center;   
            }

            @media (max-width: 640px) {
                h1 {
                    font-size: 24px;
                }
            }
        </style>
    </span>

    <span class="selectBox-container">
        <label> Select Version:</label>
        <select id="selectVersion"></select>
        <button id="downloadSelectedVersion">Download</button>
        <div id="loading" style="display: none;">Processing...</div>
    </span>
    
    <span class = "github-icon">
        <a href="https://github.com/Whitecatuwu/TheBattleCat-Resource-Pack" target="_blank">
            <i class="fab fa-github"></i>
        </a>
    </span>

    <script src="js/model.js"></script>
    <script src="js/view.js"></script>
    <script src="js/controller.js"></script>

</body>
</html>
